[pytest]
testpaths = backend/testing
pythonpath = backend/orchestrator backend .
asyncio_mode = auto
addopts = -ra
filterwarnings =
    ignore::DeprecationWarning:google.api_core.*:
    ignore::FutureWarning:google.api_core.*:
    ignore::FutureWarning:google.generativeai.*:
    ignore::starlette.exceptions.StarletteDeprecationWarning:
