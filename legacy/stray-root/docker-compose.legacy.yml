version: '1.0'

services:
  # State Checkpointing & Cache
  redis:
    image: redis/redis-stack-server:latest
    container_name: science-redis
    ports:
      - "6380:6379"
    networks:
      - science-network

  # Persistent Logs Database (Postgres)
  db:
    image: postgres:15-alpine
    container_name: science-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-science_chatbot}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - science-network

  # Vector DB for Physics & Biology RAG
  qdrant:
    image: qdrant/qdrant:latest
    container_name: science-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - science-network

  # Main API Gateway
  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    container_name: science-orchestrator
    ports:
      - "${ORCHESTRATOR_PORT:-9000}:${ORCHESTRATOR_PORT:-9000}"
    env_file:
      - .env
    depends_on:
      - redis
      - qdrant
      - db
    networks:
      - science-network

  # Math Solver
  math-service:
    build:
      context: ./services/math_service
      dockerfile: Dockerfile
    container_name: math-service
    ports:
      - "${MATH_SERVICE_PORT:-9001}:${MATH_SERVICE_PORT:-9001}"
    env_file:
      - .env
    networks:
      - science-network

  # Physics Solver
  physics-service:
    build:
      context: ./services/physics_service
      dockerfile: Dockerfile
    container_name: physics-service
    ports:
      - "${PHYSICS_SERVICE_PORT:-9002}:${PHYSICS_SERVICE_PORT:-9002}"
    env_file:
      - .env
    networks:
      - science-network

  # Chemistry Solver
  chemistry-service:
    build:
      context: ./services/chemistry_service
      dockerfile: Dockerfile
    container_name: chemistry-service
    ports:
      - "${CHEMISTRY_SERVICE_PORT:-9003}:${CHEMISTRY_SERVICE_PORT:-9003}"
    env_file:
      - .env
    networks:
      - science-network

  # Biology Solver
  biology-service:
    build:
      context: ./services/biology_service
      dockerfile: Dockerfile
    container_name: biology-service
    ports:
      - "${BIOLOGY_SERVICE_PORT:-9004}:${BIOLOGY_SERVICE_PORT:-9004}"
    env_file:
      - .env
    networks:
      - science-network

networks:
  science-network:
    driver: bridge

volumes:
  qdrant_data:
  postgres_data:
