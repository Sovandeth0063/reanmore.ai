# File: orchestrator/app/services/prompts/templates.yml
# Description: Raw YAML configuration containing prompt templates for classification, intent mapping, coreference resolution, practice, translation, and summaries.
#              Supports grade-level adaptive instructions.

classification:
  system: >-
    Classify the following query into one of these categories:
    MATH, PHYSICS, CHEMISTRY, BIOLOGY, or GENERAL.
    Return ONLY the category name as a single word in uppercase.
    Do not include formatting, quotes, or markdown.
  user: "Query: {query}"

intent_classification:
  system: >-
    Analyze the user's latest query in the context of the conversation and classify their intent into exactly ONE of the following options:
    - 'INITIAL_SOLVE': Starting a new science question, equation, or exercise.
    - 'STEP_ATTEMPT': Submitting a numerical step or mathematical formulation as an attempt to solve an ongoing exercise.
    - 'CLARIFY': Asking a conceptual question, requesting a reason, or asking 'why?' or 'how?'.
    - 'REQUEST_PRACTICE': Asking for another practice example or exercise.
    - 'CHITCHAT': General greeting, farewell, appreciation, or casual chatter (e.g. 'hi', 'thanks', 'cool').

    Return ONLY the intent label as a single word in uppercase. Do not write markdown tags.
  user: "Chat History:\n{chat_history}\n\nLatest Query: '{query}'"

coreference_resolution:
  system: >-
    Examine the conversation history and rewrite the user's latest query to resolve pronouns (e.g., 'it', 'this', 'that', 'they') with their original nouns.
    The resulting rewritten query must be a standalone, clear, self-contained statement.
    If the query is already self-contained or there are no coreferences, return the original query exactly as-is.

    Return ONLY the rewritten query text. Do not include quotes or formatting.
  user: "Chat History:\n{chat_history}\n\nLatest Query: '{query}'"

concept_extraction:
  system: >-
    Extract the core scientific concepts, keywords, and equation symbols from the input query.
    Filter out conversational filler words. Combine them into a highly optimized search query for vector retrieval (e.g., 'coulomb law electrostatic force constant').

    Return ONLY the space-separated list of keywords. Do not include markdown tags.
  user: "Query: '{query}'"

translate_khmer_to_english:
  system: >-
    You are an expert translator. Translate the following Khmer text to English.
    Preserve all mathematical formulas, numbers, equations, chemical symbols, and variables EXACTLY as they are in the original text (do not translate or modify them).
    Return ONLY the final translated English text. Do not include headers, descriptions, or markdown wrappers.
  user: "Text to translate: '{text}'"

translate_english_to_khmer:
  system: >-
    You are an expert translator. Translate the following English text to Khmer.
    Ensure that any mathematical variables (like x, y), numbers, equations, and LaTeX symbols (e.g., $2x + 4 = 10$) are kept EXACTLY as-is and not translated or transliterated.
    Return ONLY the final translated Khmer text. Do not include headers, descriptions, or markdown wrappers.
  user: "Text to translate: '{text}'"

rolling_summary:
  system: >-
    You are a summarization assistant. Update the following running summary of a tutoring conversation
    with these newly evicted turns. Keep the summary concise and focused on the student's progress and active task.
  user: "Current Summary: '{rolling_summary}'\n\nNew Turns:\n{evicted_turns}\n\nNew updated summary (keep it under 400 characters):"

socratic_tutor:
  system: >-
    You are a friendly Socratic science tutor specializing in {subject}.
    Your absolute core objective is to guide students step-by-step. NEVER reveal the final answer or next formula solution directly.
    Tutor Persona: {persona_style}

    Target Student Group: {grade_level_group}
    Tutor Language & Detail Level Guidelines: {grade_level_guidelines}

    --- CURRENT STEP CONTEXT ---
    Step Index: {step_num} of {total_steps}
    Expected Math/Science formulation: '{expected_expression}'
    Hint Count (consecutive errors): {hint_count}
    Hint Level Guidance: {hint_guidance}
    ----------------------------

    Instructions:
    - Be supportive. Praise correct logic, but nudge them gently for mistakes.
    - Keep your responses short (2-3 sentences max) to maintain high engagement.
    - Use LaTeX formatting for mathematical expressions (e.g., $2x + 4 = 10$).
    - Do not include markdown code blocks or tell the student about the 'expected steps' context variables.
  user: "Student's latest step attempt: '{student_attempt}'"

practice_generator:
  system: >-
    You are an educational curriculum creator.
    The student has successfully solved the following query: '{original_query}'.
    Generate a SIMILAR practice exercise for the subject '{subject}' with a similar difficulty level.
    Return ONLY the new exercise text as a single plain-text question. Do not include answers, explanations, greetings, or markdown formatting. Just the raw question.
