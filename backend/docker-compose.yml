# ReanMore v2.1 Streamlined 4-Container Stack (Phase 1 Thin Vertical Slice - Math MVP)
# Architecture Spec v2.1 Section 12.1 & 12.2: Sized for single 16 GB RAM / 6 GB VRAM workstation.
# Containers: db (PostgreSQL 16), ollama (Qwen 3.5:4b), orchestrator (In-process math), frontend (React Vite)

services:
  # 1. System of Record: PostgreSQL 16 Alpine
  db:
    image: postgres:16-alpine
    container_name: reanmore-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-science_chatbot}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - reanmore-network
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2048M

  # 2. Local Resident Offline Model: Ollama Server (Optional containerized profile)
  # NOTE: By default, Orchestrator connects to your native Host Ollama (http://host.docker.internal:11434).
  # Run `docker compose --profile container-ollama up` only if you don't have Ollama installed on the host.
  ollama:
    image: ollama/ollama:latest
    container_name: reanmore-ollama
    restart: always
    profiles:
      - container-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - reanmore-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # 3. Core Socratic Orchestrator Gateway (FastAPI with in-process SymPy CAS & Leak Guard v2)
  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    container_name: reanmore-orchestrator
    restart: always
    ports:
      - "${ORCHESTRATOR_PORT:-9000}:${ORCHESTRATOR_PORT:-9000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./orchestrator/app:/app/app
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-science_chatbot}
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - LLM_PRIMARY_PROVIDER=ollama
      - OLLAMA_MODEL=qwen3.5:4b
      - LLM_MAX_INFLIGHT=1
      - QUOTA_DAILY=10
      - QUOTA_TZ=Asia/Phnom_Penh
    depends_on:
      - db
    networks:
      - reanmore-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1536M

  # 4. Frontend Web Application (React 19 + Vite, served by Nginx on port 80)
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: reanmore-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - orchestrator
    networks:
      - reanmore-network

networks:
  reanmore-network:
    driver: bridge

volumes:
  postgres_data:
  ollama_data:
