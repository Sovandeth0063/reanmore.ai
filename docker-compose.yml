version: '3.8'

services:
  # ──────────────────────────────────────────────
  # Stateful Infrastructure
  # ──────────────────────────────────────────────
  redis:
    image: redis/redis-stack-server:latest
    container_name: science-redis
    ports:
      - "6379:6379"
    networks:
      - science-network

  db:
    image: postgres:15-alpine
    container_name: science-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-science_chatbot}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - science-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: science-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - science-network

  # ──────────────────────────────────────────────
  # Backend Microservices
  # ──────────────────────────────────────────────
  orchestrator:
    build:
      context: ./backend/orchestrator
      dockerfile: Dockerfile
    container_name: science-orchestrator
    ports:
      - "${ORCHESTRATOR_PORT:-9000}:${ORCHESTRATOR_PORT:-9000}"
    env_file:
      - .env
    environment:
      - MATH_SERVICE_URL=http://math-service:${MATH_SERVICE_PORT:-9001}
      - SCIENCE_SERVICE_URL=http://science-service:${SCIENCE_SERVICE_PORT:-9002}
      - HOMEWORK_SCANNER_URL=http://homework-scanner:${HOMEWORK_SCANNER_PORT:-9003}
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - QDRANT_HOST=qdrant
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-science_chatbot}
    depends_on:
      - redis
      - qdrant
      - db
    networks:
      science-network:
        aliases:
          - science-orchestrator
          - weg-orchestrator

  math-service:
    build:
      context: ./backend/services/math_service
      dockerfile: Dockerfile
    container_name: math-service
    ports:
      - "${MATH_SERVICE_PORT:-9001}:${MATH_SERVICE_PORT:-9001}"
    env_file:
      - .env
    environment:
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-flash-lite-latest}
    networks:
      science-network:
        aliases:
          - weg-math-service

  science-service:
    build:
      context: ./backend/services/science_service
      dockerfile: Dockerfile
    container_name: science-service
    ports:
      - "${SCIENCE_SERVICE_PORT:-9002}:${SCIENCE_SERVICE_PORT:-9002}"
    env_file:
      - .env
    environment:
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-flash-lite-latest}
    networks:
      science-network:
        aliases:
          - weg-science-service

  # ──────────────────────────────────────────────
  # Homework Scanner & OCR Pipeline Microservice
  # ──────────────────────────────────────────────
  homework-scanner:
    build:
      context: ./backend/homework_ocr_vlm
      dockerfile: Dockerfile
    container_name: homework-scanner
    ports:
      - "${HOMEWORK_SCANNER_PORT:-9003}:${HOMEWORK_SCANNER_PORT:-9003}"
    env_file:
      - .env
    environment:
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-flash-lite-latest}
    networks:
      science-network:
        aliases:
          - ocr-service
          - weg-ocr-service


networks:
  science-network:
    driver: bridge

volumes:
  qdrant_data:
  postgres_data:
